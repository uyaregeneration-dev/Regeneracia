<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмін — ReҐенерація</title><link rel="stylesheet" href="styles.css"></head><body><main style="padding:100px 8%"><h1>Адмін-панель</h1><div id="login"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Пароль"><button id="go">Увійти</button><p id="msg"></p></div><div id="panel" hidden><p id="user"></p><button id="out">Вийти</button><h2>Новий матеріал</h2><select id="cat"></select><input id="title" placeholder="Заголовок"><textarea id="body" placeholder="Текст"></textarea><input id="file" type="file" accept="image/*"><input id="video" placeholder="URL відео"><label><input id="pub" type="checkbox" checked> Опубліковано</label><br><button id="add">Опублікувати</button><p id="status"></p><h2>Матеріали</h2><div id="list"></div><h2>Нова категорія</h2><input id="newcat" placeholder="Назва"><button id="addcat">Додати</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
